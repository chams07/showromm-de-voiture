    <form id="inscription">
        <div class="ligne">
            <div class="champ">
                <label for="prenom">Prénom </label>
                <input type="text" id="prenom" name="prenom" required>
            </div>

            <div class="champ">
                <label for="nom">Nom </label>
                <input type="text" id="nom" name="nom" required>
            </div>
        </div>

        <div class="ligne">
            <div class="champ">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone">
            </div>

            <div class="champ">
                <label for="email">Email </label>
                <input type="email" id="email" name="email" required>
            </div>
        </div>

        <div class="champ">
            <label for="adresse">Adresse </label>
            <textarea id="adresse" name="adresse" required></textarea>
        </div>

        <div class="ligne">
            <div class="champ">
                <label for="mdp">Mot de passe </label>
                <input type="password" id="mdp" name="mdp" required>
            </div>

            <div class="champ">
                <label for="mdp_confirm">Répétez le mot de passe </label>
                <input type="password" id="mdp_confirm" name="mdp_confirm" required>
            </div>
        </div>

        <p class="obligatoire"> Champs obligatoires</p>

        <div class="boutons">
            <input type="reset" id="btn-reset" name="reset" value="RESET" class="reset">
            <input type="submit" id="btn-submit" name="submit" value="SUBMIT" class="submit">
        </div>
    </form>

    <footer>

            </ol>
            <h3>Suivez-nous</h3>
            <a href="https://www.facebook.com/chams.auto" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/chams.auto" target="_blank">Instagram</a>
            <a href="https://www.linkedin.com/company/chams.auto" target="_blank">LinkedIn</a>
        </section>
    </footer>
